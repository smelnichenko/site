# CI: Run checks on push to non-main branches or PRs

# ONE run per change: the pull request's. With `push` listed too, a push to a branch that has an open
# PR fired BOTH pipelines - two identical runs of the same sha, racing for the same agent and, here,
# for the same workspace. Nothing lands without a PR; cd.yaml still deploys on push to main.
when:
  - event: pull_request

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 100

# The checks are separate steps on purpose. Chained into one step, a formatting nit fails the whole
# thing and hides whether the tests pass; you fix the format, push, and only then learn about a test
# failure. Steps share the workspace volume, so `install` populates node_modules once and the rest
# fan out from it in parallel, each with its own red/green signal.
steps:
  - name: install
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    volumes:
      - ci-cache:/cache # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    environment:
      npm_config_cache: /cache/npm/site
    commands:
      - npm ci --prefer-offline --no-audit --no-fund # never --silent: a failed install must say why
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { cpu: 2000m, memory: 2Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_npm_registry
            target:
              env: NPM_CONFIG_REGISTRY

  - name: typecheck
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    depends_on: [install]
    commands:
      - npx tsc --noEmit
      - npx tsc --noEmit -p layout # the layout harness and its fixtures, typed against the API
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 250m, memory: 1Gi }
          limits: { cpu: 2000m, memory: 2Gi }

  - name: lint
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    # After typecheck: ESLint's type-aware rules need a well-formed program, and a type error reports
    # far more clearly from tsc than from the cascade of lint failures it would otherwise produce.
    depends_on: [typecheck]
    commands:
      - npm run lint
      - 'echo "prettier config for src/App.tsx:"; npx prettier --find-config-path src/App.tsx; cat "$(npx prettier --find-config-path src/App.tsx)"; ls -la . ..; env | grep -i -E "prettier|npm_config" || true; npx prettier --version'
      - npm run format:check
    backend_options:
      kubernetes:
        # Type-aware linting loads the whole TS program: measured ~1.0 GB peak RSS.
        resources:
          requests: { cpu: 500m, memory: 1280Mi }
          limits: { cpu: 2000m, memory: 2Gi }

  - name: test
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    depends_on: [install]
    commands:
      - npm run test:coverage
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 250m, memory: 1Gi }
          limits: { cpu: 2000m, memory: 2Gi }

  # The masi pages' layout in headless Chromium with the real stylesheet (layout/): what vitest cannot see, as jsdom
  # does no layout and no unit test loads index.css. The image's browsers are the ones @playwright/test expects:
  # the first command fails when the two drift apart, so a bump of one is a bump of both.
  - name: layout
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    depends_on: [install]
    environment:
      CI: 'true'
    commands:
      - 'v=$(node -p "require(\"@playwright/test/package.json\").version"); [ "$v" = "1.58.2" ] || { echo "@playwright/test is $v, the image is 1.58.2: bump them together"; exit 1; }'
      - npm run test:layout
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits: { cpu: 2000m, memory: 3Gi }

  - name: sonar
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    depends_on: [test]
    commands:
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "Skipping SonarQube (no token or URL)"; exit 0; }'
      - sonar-scanner
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_npm_registry
            target:
              env: NPM_CONFIG_REGISTRY
