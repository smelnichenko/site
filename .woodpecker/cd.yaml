# CD: Build + Push on push to main

when:
  - branch: main
    event: push

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp # non-root: its credentials file in a home it can write
      partial: false
      depth: 100
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  - name: test
    image: node:22-bookworm-slim
    volumes:
      - ci-cache:/cache # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    environment:
      npm_config_cache: /cache/npm/site
    commands:
      - npm ci --prefer-offline --no-audit --no-fund
      - npx tsc --noEmit
      # Same gate as CI: main must never merge past a lint or format failure.
      - npm run lint
      - npm run format:check
      - npm run test:coverage
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 } # node, the image's own
        resources:
          requests: { memory: 1Gi }
          limits: { memory: 2Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_npm_registry
            target:
              env: NPM_CONFIG_REGISTRY

  - name: sonar
    image: node:22-bookworm-slim
    depends_on: [test]
    commands:
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "SONAR_TOKEN or SONAR_HOST_URL is missing: the main analysis cannot run"; exit 1; }'
      - npx sonarqube-scanner -Dsonar.qualitygate.wait=false
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 } # node, the image's own
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_npm_registry
            target:
              env: NPM_CONFIG_REGISTRY

  # ============== BUILD + PUSH IMAGE (Kaniko) ==============
  - name: build-dist
    image: node:22-bookworm-slim
    volumes:
      - ci-cache:/cache # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    environment:
      npm_config_cache: /cache/npm/site
    commands:
      - npm ci --prefer-offline --no-audit --no-fund
      - GIT_HASH=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
      - BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      - VITE_GIT_HASH=$GIT_HASH VITE_BUILD_TIME=$BUILD_TIME npm run build
      - mkdir -p .docker-context
      - cp -r dist .docker-context/
      - cp Dockerfile.runtime .docker-context/Dockerfile
      - cp nginx.conf nginx.conf.template security-headers.conf security-headers-base.conf docker-entrypoint.sh .docker-context/
    depends_on: [test, sonar]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 } # node, the image's own
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_npm_registry
            target:
              env: NPM_CONFIG_REGISTRY

  - name: push-image
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - mkdir -p /kaniko/.docker
      - |
        echo "{\"auths\":{\"git.pmon.dev\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_TOKEN\"}}}" > /kaniko/.docker/config.json
      - GIT_HASH=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
      - |
        ls -la .docker-context/
        /kaniko/executor \
          --context=.docker-context \
          --dockerfile=.docker-context/Dockerfile \
          --destination=git.pmon.dev/schnappy/site:$GIT_HASH \
          --skip-tls-verify-registry=git.pmon.dev \
          --registry-mirror=nexus.pmon.dev:8082 \
          --insecure-registry=nexus.pmon.dev:8082 \
          --cache=true \
          --cache-repo=git.pmon.dev/schnappy/site/cache
    depends_on: [build-dist]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: false, runAsUser: 0, runAsGroup: 0 } # Kaniko builds as root - root only inside its user namespace
        secrets:
          - name: woodpecker-ci-secrets
            key: registry_user
            target:
              env: REGISTRY_USER
          - name: woodpecker-ci-secrets
            key: registry_token
            target:
              env: REGISTRY_TOKEN

  # ============== UPDATE INFRA REPO (Argo CD syncs) ==============
  - name: update-infra
    image: git.pmon.dev/schnappy/ci-tools:latest # ci-deploy in it; its user ci (uid 1000)
    commands:
      - ci-deploy site test
    depends_on: [push-image]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
        secrets:
          - name: woodpecker-ci-secrets
            key: infra_repo_token
            target:
              env: INFRA_TOKEN

  # ============== PROMOTE TO PROD (operator 2026-10-22: no more half-year pile-ups) ==============
  - name: promote-prod
    image: git.pmon.dev/schnappy/ci-tools:latest # ci-deploy in it; its user ci (uid 1000)
    commands:
      - ci-deploy site production
    depends_on: [update-infra]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
        secrets:
          - name: woodpecker-ci-secrets
            key: infra_repo_token
            target:
              env: INFRA_TOKEN
